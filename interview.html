<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice session — Prepwise</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html"><i class="brand-mark">✦</i><span>prepwise</span></a><nav class="nav"><a href="index.html">⌂ <span>Dashboard</span></a><a href="select.html">◉ <span>Start practice</span></a><a href="result.html">▣ <span>My results</span></a><a href="tips.html">✦ <span>Coach notes</span></a></nav></aside><main class="main"><div class="session"><a class="back" href="select.html">← Change track</a><header class="session-head"><div><div class="eyebrow" id="track">Practice session</div><h1>Take a moment. Think out loud.</h1></div><div class="user-pill" id="counter">Question 1 of 5</div></header><div class="progress-track"><div class="progress-fill" id="progress"></div></div><article class="question-card"><div class="question-meta"><span>INTERVIEWER PROMPT</span><span id="timer">Untimed</span></div><h2 id="question">Loading your first question…</h2><textarea class="answer" id="answer" placeholder="Write your answer, or record it below…"></textarea><div class="voice-row"><button class="secondary" id="voiceBtn" onclick="startVoice()">● Record answer</button><span class="voice-status" id="voiceStatus">Voice transcription works in supported browsers.</span><button class="primary" id="submitBtn">Submit answer →</button></div><div class="feedback" id="feedback"></div></article></div></main></div><script src="js/questions.js"></script><script src="js/scoring.js"></script><script src="js/api.js"></script><script src="js/voice.js"></script><script src="js/theme.js"></script><script>(async function(){const setup=JSON.parse(localStorage.getItem('interviewSetup')||'{"type":"hr","label":"People & culture"}');let qs;let source='local';try{const remote=await getInterviewQuestions(setup);qs=remote.questions;source=remote.source}catch{qs=getQuestionsForDomain(setup.domain,setup.type)}if(!qs||qs.length<5)qs=getQuestionsForDomain(setup.domain,setup.type);let current=0;const answers=[];track.textContent=`${setup.label||'Practice session'} · ${source==='ai'?'AI-generated':'question bank'}`;counter.textContent=`Question 1 of ${qs.length}`;function render(){question.textContent=qs[current].question||qs[current][0];counter.textContent=`Question ${current+1} of ${qs.length}`;progress.style.width=`${current/qs.length*100}%`;answer.value='';feedback.textContent=''}async function submit(){const text=answer.value.trim();if(!text){feedback.textContent='Add a few sentences before submitting so your coach has something useful to review.';return}submitBtn.disabled=true;feedback.textContent='Reviewing your answer…';const item=qs[current];const questionText=item.question||item[0];const keywords=item.keywords||item[1]||[];let result;try{result=await evaluateInterviewAnswer({domain:setup.domain||setup.label,question:questionText,keywords,answer:text})}catch{result=evaluateAnswer(text,keywords);result.source='local'}answers.push({question:questionText,answer:text,words:text.split(/\s+/).filter(Boolean).length,hits:result.hits||0,...result});feedback.textContent=result.feedback;setTimeout(()=>{submitBtn.disabled=false;if(++current<qs.length)render();else{localStorage.setItem('interviewResult',JSON.stringify({setup,answers,average:Math.round(answers.reduce((a,b)=>a+b.score,0)/answers.length)}));location.href='result.html'}},900)}submitBtn.addEventListener('click',submit);render()})();</script></body></html>
